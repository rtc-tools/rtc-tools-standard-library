[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "rtc-tools-standard-library"
dynamic = ["version"]
description = "Standard Modelica library for RTC-Tools ecosystem"
authors = [
    {name = "Joris Gillis", email = "joris@yacoda.com"}
]
# The package itself (dependencies = [], no version-specific code) supports
# Python 3.9+; the floor is set by tests/test_namespaces.py, which uses the
# keyword-only entry_points(group=...) form added in 3.10.
requires-python = ">=3.10"
dependencies = []
readme = "README.md"
license = {text = "BSD-3-Clause"}
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.entry-points."rtctools.libraries.modelica"]
library_folder = "rtctools_standard_library:modelica"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/rtctools_standard_library"]

[tool.hatch.build.hooks.vcs]
version-file = "src/rtctools_standard_library/_version.py"

[tool.pytest.ini_options]
xfail_strict = true
