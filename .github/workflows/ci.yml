name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: pip install hatchling hatch-vcs build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Assert .mo files are present
        run: |
          python - <<'PYEOF'
          import importlib.resources
          import rtctools_standard_library
          base = importlib.resources.files(rtctools_standard_library) / "modelica" / "Modelica"
          for name in ("Units.mo", "SIunits.mo", "Icons.mo", "Constants.mo"):
              p = base / name
              assert p.is_file(), f"{name} not found at {p}"
              print(f"OK: {p}")
          PYEOF

      - name: Install pymoca
        # casadi<3.6 has no cp311 wheels; casadi>=3.8.0 breaks pymoca 0.11.2's
        # division codegen (AttributeError: 'MX' object has no attribute '__div__').
        run: pip install "pymoca>=0.11,<0.12" "casadi>=3.6,<3.8" pytest

      - name: Test namespace resolution
        run: python tests/test_namespaces.py

      - name: Test Modelica library coverage
        run: pytest tests/test_modelica_library.py -v

  deploy:
    needs: build-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: pip install hatchling hatch-vcs build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
